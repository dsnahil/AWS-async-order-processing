services:
  # LocalStack - Simulates AWS services locally
  localstack:
    container_name: localstack_main
    image: localstack/localstack:latest
    ports:
      - "4566:4566"            # LocalStack Gateway
      - "4571:4571"            # LocalStack internal
    environment:
      - SERVICES=sns,sqs,cloudwatch,logs
      - DEBUG=1
      - AWS_DEFAULT_REGION=us-west-2
      - PERSISTENCE=1
      - DOCKER_HOST=unix:///var/run/docker.sock
    volumes:
      - "./init-aws.sh:/etc/localstack/init/ready.d/init-aws.sh"
      - "./localstack-data:/var/lib/localstack"
      - "/var/run/docker.sock:/var/run/docker.sock"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Order API - REST API for order management
  order-api:
    build:
      context: ./order-api
      dockerfile: Dockerfile
    container_name: order-api-local
    ports:
      - "8082:8081"
    environment:
      - AWS_REGION=us-west-2
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_ENDPOINT_URL=http://localstack:4566
      - SNS_TOPIC_ARN=arn:aws:sns:us-west-2:000000000000:order-processing-events
    depends_on:
      localstack:
        condition: service_healthy
    restart: unless-stopped

  # Order Worker - Processes orders from SQS (1 worker for baseline)
  order-worker-1:
    build:
      context: ./order-worker
      dockerfile: Dockerfile
    container_name: order-worker-1
    environment:
      - AWS_REGION=us-west-2
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_ENDPOINT_URL=http://localstack:4566
      - SQS_QUEUE_URL=http://localstack:4566/000000000000/order-processing-queue
      - WORKER_GOROUTINES=1
    depends_on:
      localstack:
        condition: service_healthy
    restart: unless-stopped

  # Additional worker for scaling tests (can scale to multiple instances)
  order-worker-2:
    build:
      context: ./order-worker
      dockerfile: Dockerfile
    container_name: order-worker-2
    environment:
      - AWS_REGION=us-west-2
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_ENDPOINT_URL=http://localstack:4566
      - SQS_QUEUE_URL=http://localstack:4566/000000000000/order-processing-queue
      - WORKER_GOROUTINES=2
    depends_on:
      localstack:
        condition: service_healthy
    restart: unless-stopped
    profiles:
      - scaling  # Only start when explicitly requested

  # Metrics collector - Gathers performance data
  metrics-collector:
    image: python:3.11-slim
    container_name: metrics-collector
    volumes:
      - ./scripts:/scripts
      - ./metrics:/metrics
    working_dir: /scripts
    command: |
      bash -c "pip install -q boto3 requests && python collect_metrics.py localstack"
    environment:
      - AWS_REGION=us-west-2
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_ENDPOINT_URL=http://localstack:4566
      - API_ENDPOINT=http://order-api:8081
    depends_on:
      - order-api
      - localstack
    profiles:
      - metrics

networks:
  default:
    name: order-processing-network

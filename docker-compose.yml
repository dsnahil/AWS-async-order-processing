version: '3.8'

services:
  localstack:
    container_name: localstack_main
    image: localstack/localstack
    ports:
      - "4566:4566"            # Edge port
    environment:
      - SERVICES=sns,sqs       # Only start what we need
      - AWS_DEFAULT_REGION=us-west-2
    volumes:
      - "./init-aws.sh:/etc/localstack/init/ready.d/init-aws.sh" # Auto-run script
      - "/var/run/docker.sock:/var/run/docker.sock"

  order-api:
    build: .                   # Assumes Dockerfile is in current dir
    ports:
      - "8080:8080"
    environment:
      - AWS_REGION=us-west-2
      - AWS_ENDPOINT_URL=http://localstack:4566  # THE KEY: Points to LocalStack
      - SNS_TOPIC_ARN=arn:aws:sns:us-west-2:000000000000:order-processing-events
    depends_on:
      - localstack

  order-worker:
    build: .
    environment:
      - AWS_REGION=us-west-2
      - AWS_ENDPOINT_URL=http://localstack:4566
      - SQS_QUEUE_URL=http://localstack:4566/000000000000/order-processing-queue
    depends_on:
      - localstack